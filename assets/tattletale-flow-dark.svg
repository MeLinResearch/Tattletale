<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1740" viewBox="0 0 1400 1740" role="img" aria-labelledby="title desc"><title id="title">Tattletale — exact quote checking and origin tracing</title><desc id="desc">Agents submit claims. Sources and quotes receive identical normalization. Exact checks assign provisional results in order: EMPTY_QUOTE, UNKNOWN_SOURCE, NOT_IN_SOURCE, otherwise PASSED. Failed or derived claims undergo lineage checking; missing parents or cycles become BROKEN_LINEAGE, which can override a pass. Final failures include origin_agent and origin_claim_id.</desc><defs><pattern id="grain" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="4" cy="8" r="0.7" fill="#f3ecd9" opacity=".10"/></pattern><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#f3ecd9" stroke-width="1.5"/></marker></defs><rect width="1400" height="1740" fill="#19171e"/><rect width="1400" height="1740" fill="url(#grain)"/><text x="70" y="65" font-family="DejaVu Sans Mono, sans-serif" font-size="16" font-weight="700" fill="#b5a8c4">EVIDENCE IN. ORIGIN OUT.</text><text x="73" y="172" font-family="DejaVu Sans, sans-serif" font-size="104" font-weight="900" fill="#725193">TATTLETALE</text><text x="68" y="163" font-family="DejaVu Sans, sans-serif" font-size="104" font-weight="900" fill="#f3ecd9">TATTLETALE</text><path d="M76 189 L1033 196 L1014 210 L83 204 Z" fill="#d4ec51"/><text x="75" y="252" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="700" fill="#f3ecd9">The inputs are messy. The verdict path isn’t.</text><text x="75" y="292" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#b5a8c4">Checks quotation, not truth. Then traces who introduced it.</text><text x="75" y="355" font-family="DejaVu Sans Mono, sans-serif" font-size="16" font-weight="700" fill="#b5a8c4">01 / COLLECT</text><path d="M75 391 L285 381 L298 478 L83 488 Z" fill="#725193" stroke="#f3ecd9" stroke-width="3"/><text x="109" y="425" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#f3ecd9">AGENT</text><text x="109" y="457" font-family="DejaVu Sans Mono, sans-serif" font-size="17" font-weight="400" fill="#f3ecd9">submitter</text><path d="M300 435 L374 435" fill="none" stroke="#f3ecd9" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="306" y="416" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#b5a8c4">submits</text><path d="M383 386 L870 376 L883 483 L391 493 Z" fill="#292330" stroke="#f3ecd9" stroke-width="3"/><text x="413" y="417" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#f3ecd9">CLAIM</text><text x="413" y="451" font-family="DejaVu Sans Mono, sans-serif" font-size="17" font-weight="400" fill="#f3ecd9">id · text · source · derived_from</text><path d="M1025 386 L1312 376 L1325 483 L1033 493 Z" fill="#292330" stroke="#f3ecd9" stroke-width="3"/><text x="1053" y="417" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#f3ecd9">SOURCE</text><text x="1053" y="450" font-family="DejaVu Sans Mono, sans-serif" font-size="18" font-weight="400" fill="#f3ecd9">name → raw text</text><path d="M633 493 L633 548" fill="none" stroke="#f3ecd9" stroke-width="2.5"  marker-end="url(#arrow)"/><path d="M1171 493 L1171 548" fill="none" stroke="#f3ecd9" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="75" y="558" font-family="DejaVu Sans Mono, sans-serif" font-size="16" font-weight="700" fill="#b5a8c4">02 / SAME RULES</text><rect x="386" y="563" width="492" height="100" fill="#d4ec51" stroke="#f3ecd9" stroke-width="2.5"/><text x="411" y="601" font-family="DejaVu Sans Mono, sans-serif" font-size="23" font-weight="700" fill="#231d2c">normalize(claim.text)</text><text x="411" y="638" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#231d2c">each quote · at check time</text><rect x="1028" y="563" width="292" height="100" fill="#d4ec51" stroke="#f3ecd9" stroke-width="2.5"/><text x="1051" y="601" font-family="DejaVu Sans Mono, sans-serif" font-size="21" font-weight="700" fill="#231d2c">normalize(text)</text><text x="1051" y="638" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#231d2c">each source · at load</text><text x="75" y="609" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#b5a8c4">Whitespace collapse</text><text x="75" y="636" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#b5a8c4">Straight quotes</text><text x="75" y="663" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#b5a8c4">Hyphen repair</text><text x="75" y="690" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#b5a8c4">Unicode NFKC</text><text x="75" y="717" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#b5a8c4">Trim edges</text><path d="M633 666 L633 738" fill="none" stroke="#f3ecd9" stroke-width="2.5"  marker-end="url(#arrow)"/><path d="M1172 666 L1172 725 L1008 725 L1008 817 L951 817" fill="none" stroke="#f3ecd9" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="1060" y="754" font-family="DejaVu Sans Mono, sans-serif" font-size="15" font-weight="400" fill="#b5a8c4">cached + SHA-256</text><text x="75" y="782" font-family="DejaVu Sans Mono, sans-serif" font-size="16" font-weight="700" fill="#b5a8c4">03 / EXACT CHECK</text><rect x="386" y="750" width="565" height="266" fill="#292330" stroke="#f3ecd9" stroke-width="2.5"/><text x="409" y="791" font-family="DejaVu Sans Mono, sans-serif" font-size="18" font-weight="700" fill="#725193">01</text><text x="459" y="791" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#f3ecd9">quote empty?</text><text x="692" y="791" font-family="DejaVu Sans Mono, sans-serif" font-size="18" font-weight="700" fill="#f3ecd9">EMPTY_QUOTE</text><path d="M409 812 H929" stroke="#b5a8c4" stroke-width="1"/><text x="409" y="853" font-family="DejaVu Sans Mono, sans-serif" font-size="18" font-weight="700" fill="#725193">02</text><text x="459" y="853" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#f3ecd9">source absent?</text><text x="692" y="853" font-family="DejaVu Sans Mono, sans-serif" font-size="18" font-weight="700" fill="#f3ecd9">UNKNOWN_SOURCE</text><path d="M409 874 H929" stroke="#b5a8c4" stroke-width="1"/><text x="409" y="915" font-family="DejaVu Sans Mono, sans-serif" font-size="18" font-weight="700" fill="#725193">03</text><text x="459" y="915" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#f3ecd9">quote absent?</text><text x="692" y="915" font-family="DejaVu Sans Mono, sans-serif" font-size="18" font-weight="700" fill="#f3ecd9">NOT_IN_SOURCE</text><text x="409" y="984" font-family="DejaVu Sans Mono, sans-serif" font-size="20" font-weight="700" fill="#f3ecd9">Otherwise: PASSED</text><text x="1004" y="892" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#b5a8c4">First failure wins.</text><text x="1004" y="921" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#b5a8c4">Provisional result.</text><path d="M668 1018 L668 1063" fill="none" stroke="#f3ecd9" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="386" y="1078" width="565" height="76" fill="#725193" stroke="#f3ecd9" stroke-width="2.5"/><text x="410" y="1123" font-family="DejaVu Sans Mono, sans-serif" font-size="23" font-weight="700" fill="#f3ecd9">FAILED or derived_from set?</text><path d="M668 1155 L668 1210" fill="none" stroke="#f3ecd9" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="688" y="1188" font-family="DejaVu Sans Mono, sans-serif" font-size="16" font-weight="400" fill="#b5a8c4">yes</text><path d="M953 1116 L1287 1116 L1287 1510 L951 1510" fill="none" stroke="#f3ecd9" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="1100" y="1097" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#b5a8c4">no: keep PASSED</text><text x="75" y="1253" font-family="DejaVu Sans Mono, sans-serif" font-size="16" font-weight="700" fill="#b5a8c4">04 / TRACE BACK</text><rect x="386" y="1225" width="565" height="152" fill="#292330" stroke="#f3ecd9" stroke-width="2.5"/><text x="412" y="1264" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#f3ecd9">LINEAGE WALK</text><text x="412" y="1300" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#f3ecd9">Follow derived_from; compare normalized quotes.</text><text x="412" y="1333" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#b5a8c4">A changed quote assigns origin to the changer.</text><path d="M953 1268 L1018 1268" fill="none" stroke="#f3ecd9" stroke-width="2.5"  marker-end="url(#arrow)"/><path d="M1032 1222 L1314 1212 L1327 1375 L1040 1385 Z" fill="#ed7950" stroke="#f3ecd9" stroke-width="3"/><text x="1055" y="1254" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#231d2c">missing parent / cycle</text><text x="1055" y="1292" font-family="DejaVu Sans Mono, sans-serif" font-size="21" font-weight="700" fill="#231d2c">BROKEN_LINEAGE</text><text x="1055" y="1327" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#231d2c">Overrides even a pass.</text><text x="1055" y="1355" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#231d2c">Origin = last known agent.</text><path d="M1180 1384 L1180 1437 L948 1437 L948 1463" fill="none" stroke="#f3ecd9" stroke-width="2.5"  marker-end="url(#arrow)"/><path d="M668 1380 L668 1460" fill="none" stroke="#f3ecd9" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="75" y="1494" font-family="DejaVu Sans Mono, sans-serif" font-size="16" font-weight="700" fill="#b5a8c4">05 / NAME IT</text><rect x="386" y="1477" width="565" height="153" fill="#231d2c" stroke="#f3ecd9" stroke-width="2.5"/><text x="409" y="1522" font-family="DejaVu Sans Mono, sans-serif" font-size="29" font-weight="700" fill="#f3ecd9">PASSED / FAILED</text><text x="409" y="1562" font-family="DejaVu Sans Mono, sans-serif" font-size="20" font-weight="700" fill="#d4ec51">Failure: reason + origin_agent</text><text x="409" y="1600" font-family="DejaVu Sans Mono, sans-serif" font-size="20" font-weight="400" fill="#d4ec51">+ origin_claim_id</text><text x="75" y="1694" font-family="DejaVu Sans Mono, sans-serif" font-size="17" font-weight="700" fill="#f3ecd9">NO MODEL CALLS. NO FUZZY MATCHING. NO NEGOTIATING THE VERDICT.</text></svg>